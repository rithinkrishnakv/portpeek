name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two currently-supported Go major releases (Go is supported
        # until there are two newer major releases - see
        # https://go.dev/doc/devel/release#policy). go.mod's declared
        # minimum (see README's "Requires Go 1.21+") is lower than both of
        # these, which is expected: CI tracks the current, maintained
        # compiler versions going forward, not the oldest version the code
        # happens to still build with.
        go-version: ["1.26", "1.27"]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmtfiles=$(gofmt -l .)
          if [ -n "$fmtfiles" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmtfiles"
            exit 1
          fi

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true


      - name: Install staticcheck
        run: |
          mkdir -p "$RUNNER_TEMP/staticcheck-bin"
          GOBIN="$RUNNER_TEMP/staticcheck-bin" go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Run staticcheck
        run: |
          "$RUNNER_TEMP/staticcheck-bin/staticcheck" -version
          "$RUNNER_TEMP/staticcheck-bin/staticcheck" ./...
